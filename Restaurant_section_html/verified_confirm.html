<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified & Confirm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Restaurant_section_css/verified_confirm.css">
</head>

<body>
    <main class="main_content">
        <div class="verified_confirm_page">
            <div class="chek_card">
                <i class="fa-solid fa-circle-check" style="color: var(--white-bg);"></i>
                <h1>تم التحقق من الحجز</h1>
                <p>الحجز صالح وجاهز للاستلام.</p>
                <div class="booking_details">
                    <h2>تفاصيل الحجز</h2>
                    <div class="meal_name">
                        <i class="fa-solid fa-utensils" style="color: rgba(37, 104, 97, 1);"></i>
                        <h3>اسم الوجبة:</h3>
                    </div>
                    <div class="quantity">
                        <i class="fa-solid fa-box-archive" style="color: rgba(37, 104, 97, 1);"></i>
                        <h3>الكمية:</h3>
                    </div>
                    <div class="condition">
                        <h3>الحالة:</h3>
                        <h4>جاهزة للتسليم</h4>
                    </div>
                </div>
                <div class="buttons">
                    <a href="meal_collected.html" class="delivery_confirmation">تأكيد تسليم الوجبة</a>
                    <a href="verify_reservation.html" class="cancel">إلغاء</a>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
