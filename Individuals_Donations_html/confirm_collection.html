<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Individuals_Donations_css/confirm_collection.css">
</head>

<body>
    <main class="main_content">
        <div class="confirm_collection_page">
            <a href="my_donations.html">
                <button class="back_button">
                    <i class="fa-solid fa-arrow-right" style="color: rgba(63, 73, 71, 1);"></i>
                </button>
            </a>
            <div class="donation_receipt_card">
                <h1>تأكيد استلام التبرع</h1>
                <p>الخطوة الأخيرة لإتمام العملية</p>
                <div class="stages_section">
                    <div class="icon_section">
                        <i class="fa-solid fa-circle-check" style="color: rgb(37, 104, 97);"></i>
                        <div class="connecting_line"></div>
                        <i class="fa-solid fa-circle" style="color: rgb(37, 104, 97);"></i>
                    </div>
                    <div class="text_section">
                        <div class="ordered">
                            <h3>تم طلب التبرع</h3>
                            <h4>مكتمل</h4>
                        </div>
                        <div class="to_be_sure">
                            <h5>تأكيد الاستلام</h5>
                            <h6>في انتظار تأكيدك</h6>
                        </div>
                    </div>
                </div>
                <h2>هل تم استلام التبرع بنجاح؟</h2>
                <p>يرجى التأكيد فقط بعد استلامك للمواد فعلياً.</p>

                <a href="donation_completed.html">

                    <button class="been_received">
                        <i class="fa-solid fa-thumbs-up" style="color: rgb(255, 255, 255);"></i>
                        نعم، تم الاستلام
                    </button>
                </a>

                <a href="">

                    <button class="encountered_problem">
                        <i class="fa-solid fa-headset" style="color: rgb(37, 104, 97);"></i>
                        واجهت مشكلة
                    </button>
                </a>
            </div>











        </div>
    </main>

</body>

</html>
