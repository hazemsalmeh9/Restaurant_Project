<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Donation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Individuals_Donations_css/add_donation.css">
</head>

<body>
    <!--------------------- الهيدر ---------------------->
    <header>
        <a href="../Individuals_Donations_html/donation_information.html">
            <button class="back_button">
                <i class="fa-solid fa-arrow-right" style="color: rgb(63, 73, 71);"></i>
            </button>
        </a>

        <hr class="thin_line">
    </header>
    <main class="main_content">
        <h1>أخبرنا ماذا تريد مشاركته.</h1>

        <div class="donation_address">
            <h2>عنوان التبرع</h2>
            <input type="text" class="donation_input" placeholder="مجموعة أغراض منزلية">
        </div>

        <div class="donation_type">
            <h2>نوع التبرع</h2>
            <div class="donation_type_buttons">
                <button class="white_button">مواد غذائية</button>
                <button class="white_button">أطعمة مغلفة</button>
                <button class="green_back">أغراض منزلية</button>
                <button class="white_button">أشياء قابلة لإعادة الاستخدام</button>
            </div>
        </div>

        <div class="description_donation">
            <h2>وصف التبرع</h2>
            <textarea class="donation_textarea" placeholder="يرجى إضافة أي تفاصيل أخرى..."></textarea>
        </div>

        <a href="../Individuals_Donations_html/donation_requested.html" class="tracking">
            <button>متابعة</button>
        </a>






    </main>

</body>

</html>
