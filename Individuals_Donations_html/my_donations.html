<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Donations - Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Individuals_Donations_css/my_donations.css">
</head>

<body>
    <!--------------------- الهيدر ---------------------->
    <header>
        <!-- later -->
        <hr class="thin_line">
    </header>
    <main class="main_content">
        <div class="my_donation_page">
            <div class="my_donation">
                <h1>تبرعاتي</h1>
                <button class="plus_icon">
                    <i class="fa-solid fa-plus" style="color: rgb(255, 255, 255);"></i>

                </button>
            </div>
            <div class="donation_section">
                <button class="green_backg">الكل</button>
                <button class="white_backg">متاح</button>
                <button class="white_backg">تم طلبه</button>
                <button class="white_backg">مكتمل</button>
            </div>
            <div class="my_donation_cards">

                <div class="donation_cards">
                    <div class="top_section">
                        <div class="objectives_icon">
                            <i class="fa-solid fa-utensils" style="color: rgba(63, 73, 71, 1);"></i>
                            <h4>طعام</h4>
                        </div>
                        <h5>متاح</h5>
                    </div>
                    <h2>سلة خضروات طازجة</h2>
                    <div class="bottom_section">
                        <p>تم النشر: قبل ساعتين</p>
                        <a href="confirm_collection.html">
                            <button class="view_details">عرض التفاصيل</button>
                        </a>
                    </div>
                </div>
                <div class="donation_cards">
                    <div class="top_section">
                        <div class="objectives_icon">
                            <i class="fa-solid fa-shirt" style="color: rgba(63, 73, 71, 1);"></i>
                            <h4>ملابس</h4>
                        </div>
                        <h5>تم طلبه</h5>
                    </div>
                    <h2>ملابس شتوية للأطفال</h2>
                    <div class="bottom_section">
                        <p>تم النشر: الأمس</p>
                        <a href="confirm_collection.html">
                            <button class="view_details">عرض التفاصيل</button>
                        </a>
                    </div>
                </div>
                <div class="donation_cards_opacity">
                    <div class="top_section">
                        <div class="objectives_icon">
                            <i class="fa-solid fa-book" style="color: rgba(63, 73, 71, 1);"></i>
                            <h4>تعليم</h4>
                        </div>
                        <h5>مكتمل</h5>
                    </div>
                    <h2>حقيبة ولوازم مدرسية</h2>
                    <div class="bottom_section">
                        <p>تم التسليم: منذ ٣ أيام</p>
                        <a href="confirm_collection.html">
                            <button class="view_details">عرض التفاصيل</button>
                        </a>
                    </div>
                </div>
            </div>




        </div>
    </main>

</body>

</html>
