<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Beneficiary_css/Global.css">
    <link rel="stylesheet" href="../Beneficiary_css/req_details.css">

    <title>Document</title>

<body style="direction: rtl;">

    <main class="req-details">

        <h1 class="header">
            <i class=" logo fa-solid fa-circle-check" style="color: rgb(111, 175, 166);"></i>
            <span>جاهزة للاستلام</span>
        </h1>

        <section class="upper-box">
            <h5 class="head">تفاصيل الطلب</h5>
            <div class="text">
                <h5>اسم الوجبة</h5>
                <h3>وجبة غداء متكاملة</h3>
            </div>
            <div class="text">
                <h5>وقت الاستلام</h5>
                <h3>2:00 م - 4:00 م</h3>
            </div>
            <div class="text text-3">
                <h5>موقع الاستلام</h5>
                <h3>مركز التوزيع  - الميدان</h3>
            </div>

            <a href="">عرض الموقع على الخريطة</a>
        </section>

        <section class="lower-box">
            <h3>رمز الاستلام</h3>
            <h5 class="text">يرجى إبراز هذا الرمز عند نقطة التوزيع</h5>
            <img style="width: 160px; height: 160px;" src="../imgs/QRcode.png" alt="">
            <h5 class="code">A7K29</h5>
        </section>

    </main>

</body>

</html>
