<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests & Reservations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Beneficiary_css/my_requests_reservations.css">
</head>

<body>
    <header class="zad_header">
        <button>
            <i class="fa-solid fa-bars" style="color: rgb(37, 104, 97);"></i>
        </button>
        <h1 class="zad">زاد الخير</h1>
        <button>
            <i class="fa-regular fa-bell" style="color: rgb(37, 104, 97);"></i>
        </button>
    </header>
    <hr class="thin_line">
    <main class="main_content">
        <h2>طلباتي</h2>
        <div class="my_requests">
            <h3>حجوزاتي</h3>
            <h4>طلبات التبرع</h4>
        </div>
        <div class="my_requests_cards">
            <div class="family_lunch_card">
                <div class="top_section">
                    <i class="fa-solid fa-utensils" style="color: rgb(37, 104, 97);"></i>
                    <div class="card_text">
                        <h2>وجبة غداء عائلية</h2>
                        <div class="my_requests_location">
                            <i class="fa-solid fa-location-dot" style="color: rgba(63, 73, 71, 1);"></i>
                            <p>حي الميدان، دمشق</p>
                        </div>
                    </div>
                    <div class="ready_for_pickup">
                        <div class="green_point"></div>
                        <p>جاهزة للاستلام</p>
                    </div>
                </div>
                <hr>
                <div class="bottom_section">

                    <p class="order_number">رقم الطلب: #1042</p>
                    <a href="../Beneficiary_html/my_reservation_details.html" class="details">

                        <h5>التفاصيل</h5>
                        <i class="fa-solid fa-chevron-left" style="color: rgb(37, 104, 97);"></i>
                    </a>
                </div>
            </div>

            <div class="assorted_pastries_card">
                <div class="top_section">
                    <i class="fa-solid fa-pizza-slice" style="color: rgb(142, 78, 20);"></i>
                    <div class="card_text">
                        <h2>معجنات مشكلة</h2>
                        <div class="my_requests_location">
                            <i class="fa-solid fa-location-dot" style="color: rgba(63, 73, 71, 1);"></i>
                            <p>المزة، دمشق</p>
                        </div>
                    </div>
                    <div class="awaiting_approval">
                        <div class="orange_point"></div>
                        <p>بانتظار الموافقة</p>
                    </div>
                </div>
                <hr>
                <div class="bottom_section">

                    <p class="order_number">رقم الطلب: #1045</p>
                    <a href="../Beneficiary_html/my_reservation_details.html" class="details">

                        <h5>التفاصيل</h5>
                        <i class="fa-solid fa-chevron-left" style="color: rgb(37, 104, 97);"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
