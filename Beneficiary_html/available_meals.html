<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Meals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Beneficiary_css/available_meals.css">
</head>

<body>
    <header class="zad_header">
        <button>
            <i class="fa-solid fa-bars" style="color: rgb(37, 104, 97);"></i>
        </button>
        <h1 class="zad">زاد الخير</h1>
        <button>
            <i class="fa-regular fa-bell" style="color: rgb(37, 104, 97);"></i>
        </button>
    </header>
    <hr class="thin_line">
    <main class="main_content">
        <div class="availabled_meals_section">
            <h1>الوجبات المتاحة</h1>
            <p>اختر وجبة مناسبة لك.</p>
        </div>
        <div class="meals_card">
            <div class="Rice_chicken_meal_card">
                <div class="top_meal_section">
                    <i class="fa-solid fa-bowl-rice" style="color: rgb(37, 104, 97);"></i>
                    <div class="meals_text">
                        <h2>وجبة أرز ودجاج</h2>
                        <div class="meal25">
                            <i class="fa-solid fa-box-archive" style="color: rgb(37, 104, 97);"></i>
                            <p>25 وجبة متاحة</p>
                        </div>
                        <hr class="box_hr">
                    </div>
                </div>
                <div class="bottom_meal_section">

                    <div class="oclock">
                        <i class="fa-regular fa-clock" style="color: rgb(111, 121, 119);"></i>
                        <p>5:00 مساءً</p>
                    </div>
                    <div class="meals_location">
                        <i class="fa-solid fa-location-dot" style="color: rgb(111, 121, 119);"></i>
                        <p>مطعم الوردة</p>
                    </div>
                </div>
                <a href="../html/meal_details.html">

                    <button class="wide_hollow_button">عرض التفاصيل</button>
                </a>
            </div>

            <div class="baked_goods_pies_card">
                <div class="top_meal_section">
                    <i class="fa-solid fa-bread-slice" style="color: rgb(142, 78, 20);"></i>
                    <div class="meals_text">
                        <h2>مخبوزات وفطائر</h2>
                        <div class="meal25">
                            <i class="fa-solid fa-box-archive" style="color: rgb(37, 104, 97);"></i>
                            <p>12 وجبة متاحة</p>
                        </div>
                        <hr class="box_hr">
                    </div>
                </div>
                <div class="bottom_meal_section">


                    <div class="oclock">
                        <i class="fa-regular fa-clock" style="color: rgb(111, 121, 119);"></i>
                        <p>8:30 مساءً</p>
                    </div>
                    <div class="meals_location">
                        <i class="fa-solid fa-location-dot" style="color: rgb(111, 121, 119);"></i>
                        <p>مخبز الأمل</p>
                    </div>
                </div>
                <a href="../Beneficiary_html/meal_details.html">


                    <button class="wide_hollow_button">عرض التفاصيل</button>
                </a>
            </div>

            <div class="mixed_family_meals_card">
                <div class="top_meal_section">
                    <i class="fa-solid fa-utensils" style="color: rgb(37, 104, 97);"></i>
                    <div class="meals_text">
                        <h2>وجبات عائلية مشكلة</h2>
                        <div class="meal25">
                            <i class="fa-solid fa-box-archive" style="color: rgb(37, 104, 97);"></i>
                            <p>5 وجبة متاحة</p>
                        </div>
                        <hr class="box_hr">
                    </div>
                </div>
                <div class="bottom_meal_section">


                    <div class="oclock">
                        <i class="fa-regular fa-clock" style="color: rgb(111, 121, 119);"></i>
                        <p>9:00 مساءً</p>
                    </div>
                    <div class="meals_location">
                        <i class="fa-solid fa-location-dot" style="color: rgb(111, 121, 119);"></i>
                        <p>مطعم الضيافة</p>
                    </div>
                </div>
                <a href="../Beneficiary_html/meal_details.html">

                    
                    <button class="wide_hollow_button">عرض التفاصيل</button>
                </a>
            </div>
        </div>





    </main>


</body>

</html>
