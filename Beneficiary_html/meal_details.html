<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Beneficiary_css/meal_details.css">
</head>

<body>
    <!--------------------- الهيدر ---------------------->
    <header>
        <!-- later -->
        <hr class="thin_line">
    </header>
    <main class="main_content">
        <div class="meal_details_cards">
            <div class="meal_name_card">
                <div class="overlay"></div>
                <i class="fa-solid fa-utensils" style="color: rgb(37, 104, 97);"></i>
                <div class="meal_details_text">
                    <p>اسم الوجبة</p>
                    <h1>وجبة عائلية متكاملة (أرز
                        ودجاج)</h1>
                </div>
            </div>
            <div class="available_quantity_card">
                <div class="overlay"></div>
                <i class="fa-solid fa-box-archive" style="color: rgb(37, 104, 97);"></i>
                <div class="meal_details_text">
                    <p>الكمية المتاحة</p>
                    <h2>تكفي ٤-٥ أشخاص</h2>
                </div>
            </div>
            <div class="preferred_delivery_time_card">
                <div class="overlay"></div>
                <i class="fa-regular fa-clock" style="color: rgb(37, 104, 97);"></i>
                <div class="meal_details_text">
                    <p>وقت الاستلام المفضل</p>
                    <h2>اليوم، بين ٦:٠٠ م - ٨:٠٠ م</h2>
                </div>
            </div>
            <div class="pickup_location_card">
                <div class="overlay"></div>
                <i class="fa-solid fa-location-dot" style="color: rgb(37, 104, 97);"></i>
                <div class="meal_details_text">
                    <p>موقع الاستلام</p>
                    <h2>حي الميدان، بالقرب من جامع
                        الحسن</h2>

                    <button class="view_on_map">
                        <i class="fa-regular fa-map" style="color: rgb(37, 104, 97);"></i>
                        <p>عرض على الخريطة</p>
                    </button>
                </div>
            </div>
            <div class="meal_reservation">
                <hr>
                <a href="../Beneficiary_html/received_successfully.html">
                    <button>حجز الوجبة</button>
                </a>
            </div>
        </div>







    </main>






</body>

</html>
