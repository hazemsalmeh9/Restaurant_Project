<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Beneficiary_css/Global.css">
    <link rel="stylesheet" href="..//Beneficiary_css/meal_details.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title></title>
</head>
<body style="direction: rtl; background-color: #eee;">
    


    <main class="meal-det" >

        <section class="box">
            <i class=" logo fa-solid fa-utensils" style="color: rgb(37, 104, 97);"></i>
            <div class="texts">
                <h5>اسم الوجبة</h5>
                <h5>وجبة عائلية متكاملة (أرزودجاج)</h5>
            </div>
        </section>

        <section class="box light">
            <i class=" logo fa-solid fa-box-archive" style="color: rgb(37, 104, 97);"></i>
            <div class="texts">
                <h5>الكمية المتاحة</h5>
                <h5>تكفي ٤-٥ أشخاص</h5>
            </div>
        </section>
        
        <section class="box light">
            <i class=" logo fa-regular fa-clock" style="color: rgb(37, 104, 97);"></i>
            <div class="texts">
                <h5>وقت الاستلام المفضل</h5>
                <h5>اليوم، بين ٦:٠٠ م - ٨:٠٠ م</h5>
            </div>
        </section>

        <section class="box light">
            <i class=" logo fa-regular fa-clock" style="color: rgb(37, 104, 97);"></i>
            <div class="texts">
                <h5>موقع الاستلام</h5>
                <h5>حي الميدان، بالقرب من جامع الحسن</h5>
                <a class="show" href="https://www.google.com/maps"> <span><i class=" map fa-regular fa-map" style="color: rgb(37, 104, 97);"></i></span>عرض على الخريطة</a>
            </div>
        </section>


        <button id="openBtn">حجز الوجبة</button>
        <div id="myModal" class="pop-up">
            <div class="modal-content">
                <i class=" logo fa-solid fa-circle-check" style="color: rgb(37, 104, 97);"></i>
                <h5>تم الاستلام بنجاح</h5>
                <h5>نتمنى أن تكون التجربة مفيدة لك.</h5>
                <a href="../Beneficiary_html/index.html">العودة للرئيسية</a>
            </div>
        </div>

    </main>



     <script src="../Js/global.js"></script>
</body>
</html>
