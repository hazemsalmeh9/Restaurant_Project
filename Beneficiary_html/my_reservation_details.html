<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reservation Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Beneficiary_css/my_reservation_details.css">
</head>

<body>
    <!--------------------- الهيدر ---------------------->
    <header>
        <!-- later -->
        <hr class="thin_line">
    </header>
    <main class="main_content">
        <div class="my_reservation_details_cards">
            <div class="ready_for_pickup">
                <i class="fa-solid fa-circle-check" style="color: rgba(111, 175, 166, 1);"></i>
                <h1>جاهزة للاستلام</h1>
            </div>
            <div class="reservation_details_card">
                <h2>تفاصيل الطلب</h2>
                <div class="line">
                    <p>اسم الوجبة</p>
                    <h3>وجبة غداء متكاملة</h3>
                </div>
                <hr>
                <div class="line">
                    <p>وقت الاستلام</p>
                    <h3>2:00 م - 4:00 م</h3>
                </div>
                <hr>
                <div class="line">
                    <p>موقع الاستلام</p>
                    <h3>مركز التوزيع - الميدان</h3>
                </div>
                <a href="">
                    <button>عرض الموقع على الخريطة</button>
                </a>
            </div>
            <div class="pickup_code_card">
                <h2>رمز الاستلام</h2>
                <p>يرجى إبراز هذا الرمز عند نقطة التوزيع</p>
                <div class="qrcode">
                    <i class="fa-solid fa-qrcode" style="color: rgb(37, 104, 97);"></i>
                </div>
                <div class="code_number">
                    <h3>A7K29</h3>
                </div>
            </div>
        </div>




    </main>

</body>

</html>
