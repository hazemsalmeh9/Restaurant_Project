<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Donations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="../Beneficiary_css/global.css">
    <link rel="stylesheet" href="../Beneficiary_css/availabled_donations.css">
</head>

<body>
    <!--------------------- الهيدر ---------------------->
    <header>
        <!-- later -->
        <hr class="thin_line">
    </header>

    <main class="main_content">
        <div class="availabled_section">
            <h1>التبرعات المتاحة</h1>
            <p>استعرض الأشياء المتاحة للاستفادة.</p>
        </div>
        <div class="availabled_card">
            <div class="box_card">
                <div class="top_availabled_section">
                    <i class="fa-solid fa-box-archive" style="color: rgb(37, 104, 97);"></i>
                    <div class="box_text">
                        <h2>أغراض منزلية بحالة جيدة</h2>
                        <div class="household">
                            <i class="fa-solid fa-shapes" style="color: rgb(63, 73, 71);"></i>
                            <p>أغراض منزلية</p>
                        </div>
                        <div class="location">
                            <i class="fa-solid fa-location-dot" style="color: rgb(63, 73, 71);"></i>
                            <p>منطقة الميدان</p>
                        </div>
                    </div>
                </div>
                <button class="narrow_hollow_button">عرض التفاصيل</button>
            </div>

            <div class="clothes_card">
                <div class="top_availabled_section">

                    <i class="fa-solid fa-shirt" style="color: rgb(37, 104, 97);"></i>
                    <div class="box_text">
                        <h2>ملابس شتوية للأطفال
                            والنساء</h2>
                        <div class="household">
                            <i class="fa-solid fa-shapes" style="color: rgb(63, 73, 71);"></i>
                            <p>ملابس</p>
                        </div>
                        <div class="location">
                            <i class="fa-solid fa-location-dot" style="color: rgb(63, 73, 71);"></i>
                            <p>دمشق القديمة</p>
                        </div>
                    </div>
                </div>
                <button class="narrow_hollow_button">عرض التفاصيل</button>
            </div>

            <div class="book_card">
                <div class="top_availabled_section">


                    <i class="fa-solid fa-book" style="color: rgb(37, 104, 97);"></i>
                    <div class="box_text">
                        <h2>مجموعة كتب دراسية
                            للمرحلة الإعدادية</h2>
                        <div class="household">
                            <i class="fa-solid fa-shapes" style="color: rgb(63, 73, 71);"></i>
                            <p>تعليم وقرطاسية</p>
                        </div>
                        <div class="location">
                            <i class="fa-solid fa-location-dot" style="color: rgb(63, 73, 71);"></i>
                            <p>المزة</p>
                        </div>
                    </div>
                </div>
                <button class="narrow_hollow_button">عرض التفاصيل</button>
            </div>

            <div class="furniture_card">
                <div class="top_availabled_section">


                    <i class="fa-solid fa-couch" style="color: rgb(37, 104, 97);"></i>
                    <div class="box_text">
                        <h2>أثاث مكتبي وكراسي بحالة
                            ممتازة</h2>
                        <div class="household">
                            <i class="fa-solid fa-shapes" style="color: rgb(63, 73, 71);"></i>
                            <p>أثاث</p>
                        </div>
                        <div class="location">
                            <i class="fa-solid fa-location-dot" style="color: rgb(63, 73, 71);"></i>
                            <p>مشروع دمر</p>
                        </div>
                    </div>
                </div>
                <button class="narrow_hollow_button">عرض التفاصيل</button>
            </div>

        </div>

    </main>













</body>

</html>
