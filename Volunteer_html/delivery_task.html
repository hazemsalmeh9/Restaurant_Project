<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Beneficiary_css/Global.css">

    <title></title>
    <script src="../Js/global.js" defer></script>

<body style="direction: rtl;">
    
    <div class="header">
        <i class="logo-1 fa-solid fa-arrow-right" style="color: rgb(63, 73, 71);"></i>
        <h1>مهمة نشطة</h1>
    </div>
    <main class="del-tak">

        <div class="steps">
            <div class=" line line-1 step accept">
                <i class=" logo-ac fa-solid fa-check" style="color: rgba(0, 66, 60, 1);"></i>
                <h5>قبول</h5>
            </div>
            <div class="line step take">
                <i class=" logo-ac fa-solid fa-check" style="color: rgba(0, 66, 60, 1);"></i>
                <h5>الاستلام</h5>
            </div>
            <div class="line step deliver">
                <i class="logo-2  fa-solid fa-truck"></i>
                <h5>التوصيل</h5>
            </div>
            <div class="step approve">
                <i class="logo-2 fa-solid fa-check-double" style="color: rgb(63, 73, 71);"></i>
                <h5>التأكيد</h5>
            </div>
        </div>



        <div class="box">
            <div class="head">
                <h2>جاهز للتوصيل</h2>
                <div class="est">
                    <i class="fa-regular fa-clock" style="color: rgb(37, 104, 97);"></i>
                    <h5>الوقت المقدر: ١٥ دقيقة</h5>
                </div>
            </div>
            <div class="cont det">
                <i class="fa-solid fa-utensils" style="color: rgb(111, 175, 166);"></i>
                <div class="texts">
                    <h5>المحتوى</h5>
                    <h2>25 وجبة ساخنة</h2>
                </div>
            </div>

            <div class="dest det">
                <i class="fa-solid fa-location-dot" style="color: rgb(111, 175, 166);"></i>
                <div class="texts">
                    <h5>الوجهة</h5>
                    <h2>مركز إيواء حي الصالحية</h2>
                    <a href="https://www.youtube.com/">عرض على الخريطة</a>
                </div>
            </div>

            <div class="note">
                <i class="fa-solid fa-circle-info" style="color: rgb(142, 78, 20);"></i>
                <div class="texts">
                    <h5>ملاحظات هامة:</h5>
                    <h6>يرجى التسليم للمشرف الميداني.</h6>
                </div>
            </div>

        </div>
        <a class="main-but"  href="../Volunteer_html/confirm.html">empty but</a>
    
    </main>

</html>
