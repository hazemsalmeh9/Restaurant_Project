<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Beneficiary_css/Global.css">
    <link rel="stylesheet" href="../Volunteer_css/pickup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title></title>
    <script src="../Js/global.js" defer></script>
</head>
<body style="direction: rtl;">
    

    <main class="pickup" >
        <div class="header">
            <i class="logo-1 fa-solid fa-xmark" style="color: rgb(63, 73, 71);"></i>
            <h1>المهمة الحالية</h1>
        </div>
        <div class="steps">
            <div class=" line line-1 step accept">
                <i class=" logo-ac fa-solid fa-check" style="color: rgb(255, 255, 255);"></i>
                <h5>قبول</h5>
            </div>
            <div class="line step take">
                <i class=" logo-t fa-solid fa-circle" style="color: rgb(111, 175, 166);"></i>
                <h5>الاستلام</h5>
            </div>
            <div class="line step deliver">
                <i class="logo-2  fa-solid fa-truck" style="color: rgb(63, 73, 71);"></i>
                <h5>التوصيل</h5>
            </div>
            <div class="step approve">
                <i class="logo-2 fa-solid fa-check-double" style="color: rgb(63, 73, 71);"></i>
                <h5>التأكيد</h5>
            </div>
        </div>

        <div class="texts">
            <h2>حان وقت الاستلام</h2>
            <h6>يرجى التوجه إلى نقطة الاستلام المحددة.</h6>
        </div>

        <div class="box">
            <div class="head">
                <i class="logo-3 fa-solid fa-store" style="color: rgb(111, 175, 166);"></i>
                <div class="texts-2">
                    <h3>مطعم الخير</h3>
                    <h5>شارع الحمراء، دمشق</h5>
                </div>
            </div>

            <div class="loc">
                <a href="">
                    <i class="logo-4 fa-solid fa-diamond-turn-right" style="color: rgb(37, 104, 97);"></i>
                    <h6>الحصول على الاتجاهات</h6>
                </a>
            </div>

            <div class="lower">
                <div class="right">
                    <h6>الكمية المستهدفة</h6>
                    <h4>
                        <i class="fa-solid fa-box-archive" style="color: rgb(111, 175, 166);"></i>
                        25 وجبة
                    </h4>
                </div>
                <div class="left">
                    <h6>وقت الاستلام المتوقع</h6>
                    <h4>
                        <i class="fa-regular fa-clock" style="color: rgb(111, 175, 166);"></i>
                        5:00 PM
                    </h4>
                </div>
            </div>
        </div>
        
        <a href="../Volunteer_html/delivery_task.html">تأكيد الاستلام</a>
        <a href="">هل تواجه مشكلة؟</a>

    </main>

</body>
</html>
